[project]
name = "memo-bench"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic",
  "google-genai",
  "python-dotenv",
  "chromadb",
  "hydra-core",
  "pydantic",
  "numpy",
  "pandas",
  "tiktoken",
  "tabulate",
  "orjson",
  "rank-bm25",
  "nltk",
  "httpx",
  "jinja2>=3.1.6",
  "openai>=3.36.0",
  "azure-identity>=1.26.0",
  "redis>=8.1.0",
  "markdownify>=1.2.3",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1.5",
  "pdfplumber>=0.11.10",
  "importlib-metadata>=9.0.1",
  "rouge-score>=0.1.2",
  "matplotlib>=3.11.2",
  "tqdm>=4.70.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memobench"]
